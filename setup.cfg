[metadata]
name = streampts
version = 0.1.0

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.8
install_requires =
    numpy>=1.20
    plotly>=5.18
    tomli>=2.0

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    streampts = streampts.cli:main
